name: Deploy candidate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment and Azure environment name
        required: true
        type: choice
        options: [dev, staging, production]
      version:
        description: Immutable release version (for example 2.1.0)
        required: true
        type: string
      prompt_version:
        description: Prompt version to register as candidate
        required: true
        type: string
      location:
        description: Azure region
        required: true
        type: string
      resource_group:
        description: Existing deployment resource group
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: genaiops-deployment-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DEPLOYMENT_NAME: genaiops-${{ inputs.environment }}
  IMAGE_TAG: ${{ inputs.version }}-${{ github.sha }}

jobs:
  deploy:
    name: Infrastructure, immutable images, agent, and registration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate explicit inputs and candidate quality
        shell: bash
        run: |
          [[ '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release version.' >&2; exit 1; }
          [[ '${{ inputs.prompt_version }}' =~ ^v[0-9]+$ ]] || { echo 'Invalid prompt version.' >&2; exit 1; }
          node src/Web/scripts/validate-content.mjs --candidate '${{ inputs.prompt_version }}' --output candidate-evaluation.json
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision infrastructure
        shell: bash
        run: |
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group '${{ inputs.resource_group }}' \
            --template-file Infrastructure/main.bicep \
            --parameters environmentName='${{ inputs.environment }}' \
                         location='${{ inputs.location }}' \
                         deployApplications=false \
                         imageTag="$IMAGE_TAG" \
            --only-show-errors
      - name: Sign in to Azure Container Registry
        shell: bash
        run: |
          ACR_NAME=$(az deployment group show --name "$DEPLOYMENT_NAME" --resource-group '${{ inputs.resource_group }}' --query properties.outputs.containerRegistryName.value -o tsv)
          ACR_SERVER=$(az deployment group show --name "$DEPLOYMENT_NAME" --resource-group '${{ inputs.resource_group }}' --query properties.outputs.containerRegistryLoginServer.value -o tsv)
          az acr login --name "$ACR_NAME"
          echo "ACR_SERVER=$ACR_SERVER" >> "$GITHUB_ENV"
      - name: Build and push immutable images
        shell: bash
        run: |
          declare -A repositories=(
            [api]=genaiops-api
            [web]=genaiops-web
            [shadowEvaluator]=genaiops-shadow-evaluator
            [metricsAggregator]=genaiops-metrics-aggregator
            [promotionEngine]=genaiops-promotion-engine
            [rollbackEngine]=genaiops-rollback-engine
          )
          declare -A dockerfiles=(
            [api]=src/Api/Dockerfile
            [web]=src/Web/Dockerfile
            [shadowEvaluator]=src/Workers/ShadowEvaluator/Dockerfile
            [metricsAggregator]=src/Workers/MetricsAggregator/Dockerfile
            [promotionEngine]=src/Workers/PromotionEngine/Dockerfile
            [rollbackEngine]=src/Workers/RollbackEngine/Dockerfile
          )
          declare -A contexts=([api]=. [web]=src/Web [shadowEvaluator]=. [metricsAggregator]=. [promotionEngine]=. [rollbackEngine]=.)
          echo '{}' > image-references.json
          for workload in api web shadowEvaluator metricsAggregator promotionEngine rollbackEngine; do
            tag="$ACR_SERVER/${repositories[$workload]}:$IMAGE_TAG"
            docker build --file "${dockerfiles[$workload]}" --tag "$tag" "${contexts[$workload]}"
            docker push "$tag"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")
            jq --arg key "$workload" --arg value "$digest" '. + {($key): $value}' image-references.json > image-references.tmp
            mv image-references.tmp image-references.json
          done
      - name: Deploy immutable image digests
        shell: bash
        run: |
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group '${{ inputs.resource_group }}' \
            --template-file Infrastructure/main.bicep \
            --parameters environmentName='${{ inputs.environment }}' \
                         location='${{ inputs.location }}' \
                         imageTag="$IMAGE_TAG" \
                         imageReferences=@image-references.json \
            --only-show-errors
      - name: Register model-backed candidate agent
        shell: pwsh
        run: |
          $apiUrl = az deployment group show --name $env:DEPLOYMENT_NAME --resource-group '${{ inputs.resource_group }}' --query properties.outputs.apiUrl.value -o tsv
          ./scripts/Invoke-GenAIOpsRelease.ps1 `
            -Action RegisterCandidate `
            -ApiUrl $apiUrl `
            -RegistryId default `
            -Actor "github:${{ github.actor }}" `
            -Version '${{ inputs.prompt_version }}' `
            -AgentId "genaiops-agent-${{ inputs.version }}"
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ inputs.environment }}-${{ inputs.version }}
          path: |
            candidate-evaluation.json
            image-references.json
          if-no-files-found: warn
          retention-days: 30
      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Candidate deployment'
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Version: \`${{ inputs.version }}\`"
            echo "- Prompt: \`${{ inputs.prompt_version }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Authentication: GitHub OIDC'
            echo '- Images: immutable registry digest references'
          } >> "$GITHUB_STEP_SUMMARY"
